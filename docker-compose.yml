version: "3.9"

# ============================================
# DataShield - Complete Microservices Stack
# Updated with Persistence & Orchestration
# ============================================

services:
  # INFRASTRUCTURE: Database (MongoDB)
  mongo:
    image: mongo:latest
    container_name: datashield-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - datashield-network
    restart: unless-stopped

  # INFRASTRUCTURE: Orchestration (Airflow)
  airflow:
    image: apache/airflow:2.7.1
    container_name: datashield-airflow

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__RBAC: "True"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth

      _AIRFLOW_DB_UPGRADE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin

    ports:
      - "8081:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/datasets:/opt/airflow/datasets
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config

    command: bash -c "airflow db migrate && airflow users create \
      --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com; \
      airflow webserver & airflow scheduler"

    restart: unless-stopped
    networks:
      - datashield-network

  # SERVICE 1: Authentication (Port 8001)
  auth-service:
    build: ./services/auth-serv
    container_name: auth-service
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      - mongo
    networks:
      - datashield-network
    restart: unless-stopped

  # SERVICE 2: Taxonomie PII/SPI (Port 8002)
  taxonomie-service:
    build: ./services/taxonomie-serv
    container_name: taxonomie-service
    env_file:
      - .env
    ports:
      - "8002:8002"
    depends_on:
      - mongo
    networks:
      - datashield-network
    volumes:
      - ./services/taxonomie-serv/backend:/app/backend
      - ./services/common:/common
    restart: unless-stopped

  # SERVICE 3: Presidio Detection (Port 8003)
  presidio-service:
    build: ./services/presidio-serv
    container_name: presidio-service
    env_file:
      - .env
    ports:
      - "8003:8003"
    depends_on:
      - mongo
    networks:
      - datashield-network
    volumes:
      - ./services/presidio-serv:/app
      - ./services/common:/common
    restart: unless-stopped

  # SERVICE 4: Data Cleaning (Port 8004)
  cleaning-service:
    build: ./services/cleaning-serv
    container_name: cleaning-service
    env_file:
      - .env
    ports:
      - "8004:8004"
    depends_on:
      - mongo
    networks:
      - datashield-network
    volumes:
      - ./services/common:/common
      - ./services/cleaning-serv/storage:/app/storage
      - ./atlas_integration:/app/atlas_integration
      - ./ranger_integration:/app/ranger_integration
      - ./airflow/datasets:/opt/airflow/datasets # Shared volume for exports
    restart: unless-stopped

  # SERVICE 5: ML Classification (Port 8005)
  classification-service:
    build: ./services/classification-serv
    container_name: classification-service
    env_file:
      - .env
    ports:
      - "8005:8005"
    depends_on:
      - mongo
    networks:
      - datashield-network
    volumes:
      - ./services/common:/common
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8005/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # SERVICE 6: Correction (Port 8006)
  correction-service:
    build: ./services/correction-serv
    container_name: correction-service
    env_file:
      - .env
    ports:
      - "8006:8006"
    depends_on:
      - mongo
    networks:
      - datashield-network
    volumes:
      - ./services/common:/common
    restart: unless-stopped

  # SERVICE 7: Annotation (Port 8007)
    # SERVICE 7: Annotation (Port 8007)
  annotation-service:
    build: ./services/annotation-serv
    container_name: annotation-service

    env_file:
      - .env

    environment:
      CLEANING_SERVICE_URL: http://cleaning-service:8004
      PRESIDIO_SERVICE_URL: http://presidio-service:8003
      ETHIMASK_SERVICE_URL: http://ethimask-service:8009

      CLEANING_TIMEOUT: 120
      PRESIDIO_TIMEOUT: 30
      ETHIMASK_TIMEOUT: 120

      MASK_BATCH_SIZE: 100

    ports:
      - "8007:8007"

    depends_on:
      - mongo
      - cleaning-service
      - presidio-service
      - ethimask-service

    networks:
      - datashield-network

    volumes:
      - ./services/common:/common
      - ./airflow/datasets:/opt/airflow/datasets

    restart: unless-stopped
  
  # SERVICE 8: Quality ISO 25012 (Port 8008)
  quality-service:
    build: ./services/quality-serv
    container_name: quality-service
    env_file:
      - .env
    environment:
      - CLEANING_SERVICE_URL=http://cleaning-service:8004
    ports:
      - "8008:8008"
    depends_on:
      - mongo
    networks:
      - datashield-network
    volumes:
      - ./services/common:/common
    restart: unless-stopped

  # SERVICE 9: EthiMask (Port 8009)
  ethimask-service:
    build: ./services/ethimask-serv
    container_name: ethimask-service
    env_file:
      - .env
    ports:
      - "8009:8009"
    volumes:
      - ./services/ethimask-serv:/app
      - ./services/common:/common
    depends_on:
      - mongo
    networks:
      - datashield-network
    restart: unless-stopped

  # MODERN FRONTEND: DataShield (Port 3000)
  datashield-modern:
    build: ./frontend-react
    container_name: datashield-modern
    ports:
      - "3000:80"
    networks:
      - datashield-network
    restart: unless-stopped

  # NGINX GATEWAY (Port 8000)
  nginx-gateway:
    image: nginx:latest
    container_name: nginx-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./gateway-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - taxonomie-service
      - cleaning-service
      - annotation-service
      - datashield-modern
      - streamshield-serv
    networks:
      - datashield-network
    restart: unless-stopped

  # INFRASTRUCTURE: Kafka (mode KRaft, sans Zookeeper)
  kafka:
    image: apache/kafka:latest
    hostname: kafka
    container_name: datashield-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - datashield-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # SERVICE 10: StreamShield - Real-time Detection & Protection (Port 8010)
  streamshield-serv:
    build: ./services/streamshield-serv
    ports:
      - "8010:8010"
      - "8012:8012"
    env_file:
      - .env
    environment:
      CLEANING_SERVICE_URL: http://cleaning-service:8004
      CLEANING_TIMEOUT: 30
      ETHIMASK_SERVICE_URL: http://ethimask-service:8009
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_started
      cleaning-service:
        condition: service_started
      ethimask-service:
        condition: service_started
    networks:
      - datashield-network
    restart: unless-stopped
    volumes:
      - ./services/streamshield-serv:/app
      - ./atlas_integration:/app/atlas_integration
      - ./services/common:/common

  # INFRASTRUCTURE: Prometheus (métriques)
  prometheus:
    image: prom/prometheus:latest
    container_name: datashield-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - datashield-network
    restart: unless-stopped

  # INFRASTRUCTURE: Grafana (dashboards)
  grafana:
    image: grafana/grafana:10.4.5 
    container_name: datashield-grafana
    environment:           
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SERVER_ROOT_URL=http://localhost:8000/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_INSTALL_PLUGINS=https://github.com/grafana/grafana-infinity-datasource/releases/download/v2.12.2/yesoreyeram-infinity-datasource-2.12.2.zip;yesoreyeram-infinity-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - datashield-network
    restart: unless-stopped

# NETWORK & VOLUMES
networks:
  datashield-network:
    driver: bridge

volumes:
  mongo_data:
  kafka_data:
  prometheus_data:
  grafana_data: